name: Crear Widget Hora

on:
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]          # se compila en cada cambio
    tags: ["v*"]              # y al crear una versión (ej. v2.0) se publica en Releases

permissions:
  contents: write             # necesario para adjuntar el instalador a la Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install pyinstaller

      - name: Crear Widget Hora.exe
        run: python -m PyInstaller --onefile --noconsole --clean --name "Widget Hora" --icon icon.ico widget.py

      - name: Crear Widget Hora Config.exe
        run: python -m PyInstaller --onefile --noconsole --name "Widget Hora Config" --icon icon_config.ico config_app.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear el instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Widget_Hora_Setup
          path: installer/Widget_Hora_Setup.exe

      - name: Publicar en Releases (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Widget_Hora_Setup.exe
          generate_release_notes: true
